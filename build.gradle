plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
}

def mcVersion = sc.current.version
// These lines make the mod filename `{mod.id}-${mod.version}+${sc.current.version}.jar`
version = "${property('mod.version')}+${mcVersion}"
base.archivesName = property('mod.id') as String

loom {
    splitEnvironmentSourceSets()

    mods {
        "winter-of-making" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

fabricApi {
    configureDataGeneration {
        client = true
    }
}


def requiredJava = JavaVersion.VERSION_21

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${property('deps.yarn_mappings')}:v2"

    modImplementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property("deps.fabric_api")}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${property("deps.rei")}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${property("deps.rei")}"
}


java {
    withSourcesJar()
    sourceCompatibility = requiredJava
    targetCompatibility = requiredJava
}

processResources {
    inputs.property("minecraft_version", mcVersion)
    inputs.property("version", version)
    filesMatching("fabric.mod.json") {
        expand([
                "minecraft_version": mcVersion,
                "version"          : version
        ])
    }
}